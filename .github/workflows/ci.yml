name: build-and-test

# Run on every push and PR to main, and allow manual runs from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04   # ships LLVM 18 in its package archive
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 cmake ninja-build

      - name: Build the pass
        run: ./scripts/build.sh

      - name: Run the test suite
        run: ./scripts/run_tests.sh
